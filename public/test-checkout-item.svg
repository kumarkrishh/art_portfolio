<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title description">
  <title id="title">One dollar checkout test</title>
  <desc id="description">A test card stating that no artwork will be shipped</desc>
  <rect width="1200" height="1200" fill="#f6f1ea"/>
  <rect x="90" y="90" width="1020" height="1020" rx="36" fill="#fff" stroke="#18181b" stroke-width="6"/>
  <text x="600" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" letter-spacing="12" fill="#71717a">LIVE CHECKOUT TEST</text>
  <text x="600" y="620" text-anchor="middle" font-family="Georgia, serif" font-size="220" fill="#18181b">$1</text>
  <line x1="300" y1="725" x2="900" y2="725" stroke="#d6d3d1" stroke-width="3"/>
  <text x="600" y="835" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" fill="#3f3f46">NO ARTWORK WILL BE SHIPPED</text>
  <text x="600" y="920" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" fill="#71717a">Payment may be refunded after verification</text>
</svg>
